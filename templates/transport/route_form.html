{% extends 'base.html' %}
{% block title %}{{ action }} Route — LogiCraft{% endblock %}
{% block content %}
<div class="mb-4">
    <a href="{% url 'transport:route_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back to Routes
    </a>
</div>
<div class="card mx-auto" style="max-width:680px;">
    <div class="card-header">
        <i class="bi bi-signpost-split me-2"></i>{{ action }} Transport Route
    </div>
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            {% if not route %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Route Code <span class="text-danger">*</span></label>
                <input type="text" name="route_code" class="form-control" placeholder="e.g. DL-AGR-001" required>
                <div class="form-text">Unique identifier for this route</div>
            </div>
            {% endif %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Source City <span class="text-danger">*</span></label>
                    <input type="text" name="source_city" class="form-control" value="{{ route.source_city|default:'' }}" placeholder="e.g. Delhi" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Source Terminal</label>
                    <input type="text" name="source_terminal" class="form-control" value="{{ route.source_terminal|default:'' }}" placeholder="e.g. ISBT Kashmiri Gate">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Destination City <span class="text-danger">*</span></label>
                    <input type="text" name="destination_city" class="form-control" value="{{ route.destination_city|default:'' }}" placeholder="e.g. Agra" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Destination Terminal</label>
                    <input type="text" name="destination_terminal" class="form-control" value="{{ route.destination_terminal|default:'' }}" placeholder="e.g. Agra Cantt Bus Station">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Distance (km) <span class="text-danger">*</span></label>
                    <input type="number" name="distance_km" step="0.01" class="form-control" value="{{ route.distance_km|default:'' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Duration (hours) <span class="text-danger">*</span></label>
                    <input type="number" name="estimated_duration_hours" step="0.25" class="form-control" value="{{ route.estimated_duration_hours|default:'' }}" required>
                </div>
                {% if route %}
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if route.is_active %}checked{% endif %}>
                        <label class="form-check-label fw-semibold" for="is_active">Route Active</label>
                    </div>
                </div>
                {% endif %}
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>{{ action }} Route
                </button>
                <a href="{% url 'transport:route_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
