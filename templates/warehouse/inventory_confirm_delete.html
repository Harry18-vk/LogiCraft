{% extends 'base.html' %}
{% block title %}Delete Inventory Item — LogiCraft{% endblock %}
{% block content %}
<div class="card mx-auto mt-5" style="max-width:500px;">
    <div class="card-header bg-danger text-white">
        <i class="bi bi-exclamation-triangle me-2"></i>Confirm Item Removal
    </div>
    <div class="card-body text-center py-4">
        <p class="fs-5">Remove <strong>{{ item.item_name }}</strong> ({{ item.sku }}) from <strong>{{ item.warehouse.code }}</strong>?</p>
        <p class="text-muted">Qty: {{ item.quantity }} units</p>
        <form method="post" class="d-flex justify-content-center gap-3 mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Yes, Remove</button>
            <a href="{% url 'warehouse:warehouse_detail' item.warehouse.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
