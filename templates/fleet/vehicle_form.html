{% extends 'base.html' %}
{% block title %}{{ action }} Vehicle — LogiCraft{% endblock %}
{% block content %}
<div class="mb-4">
    <a href="{% url 'fleet:fleet_list' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back to Fleet
    </a>
</div>
<div class="card mx-auto" style="max-width:680px;">
    <div class="card-header">
        <i class="bi bi-truck me-2"></i>{{ action }} Vehicle
    </div>
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                {% if not vehicle %}
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Registration Number <span class="text-danger">*</span></label>
                    <input type="text" name="reg_number" class="form-control text-uppercase" placeholder="e.g. DL01AB1234" required>
                </div>
                {% endif %}
                <div class="col-md-{% if vehicle %}6{% else %}6{% endif %}">
                    <label class="form-label fw-semibold">Model Name <span class="text-danger">*</span></label>
                    <input type="text" name="model_name" class="form-control" value="{{ vehicle.model_name|default:'' }}" placeholder="e.g. Tata Signa 4825.TK" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Vehicle Type <span class="text-danger">*</span></label>
                    <select name="vehicle_type" class="form-select" required>
                        {% for val, label in vehicle_types %}
                        <option value="{{ val }}" {% if vehicle.vehicle_type == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fuel Type</label>
                    <select name="fuel_type" class="form-select">
                        {% for val, label in fuel_types %}
                        <option value="{{ val }}" {% if vehicle.fuel_type == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Cargo Capacity (kg)</label>
                    <input type="number" name="capacity_kg" step="0.01" class="form-control" value="{{ vehicle.capacity_kg|default:'' }}" placeholder="e.g. 20000">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Passenger Capacity</label>
                    <input type="number" name="passenger_capacity" class="form-control" value="{{ vehicle.passenger_capacity|default:0 }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Current Location</label>
                    <input type="text" name="current_location" class="form-control" value="{{ vehicle.current_location|default:'' }}" placeholder="e.g. Delhi Hub">
                </div>
                {% if vehicle %}
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status" class="form-select">
                        {% for val, label in status_choices %}
                        <option value="{{ val }}" {% if vehicle.status == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Odometer (km)</label>
                    <input type="number" name="odometer_km" step="0.01" class="form-control" value="{{ vehicle.odometer_km|default:0 }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Latitude</label>
                    <input type="number" name="latitude" step="0.000001" class="form-control" value="{{ vehicle.latitude|default:'28.613900' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Longitude</label>
                    <input type="number" name="longitude" step="0.000001" class="form-control" value="{{ vehicle.longitude|default:'77.209000' }}">
                </div>
                {% endif %}
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>{{ action }} Vehicle
                </button>
                <a href="{% url 'fleet:fleet_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
