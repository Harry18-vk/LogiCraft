{% extends 'base.html' %}

{% block title %}Register Vehicle - LogiCraft{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold text-dark mb-1">Register New Fleet Asset</h4>
                    <p class="text-muted small mb-0">Enter the vehicle telematics and payload specification.</p>
                </div>
                <a href="{% url 'fleet:fleet_list' %}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Back to Fleet
                </a>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Registration Number *</label>
                        <input type="text" name="reg_number" class="form-control" placeholder="e.g. DL-01-AB-9999" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Vehicle Model & Make *</label>
                        <input type="text" name="model_name" class="form-control" placeholder="e.g. Tata Signa 4825.TK" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Vehicle Category *</label>
                        <select name="vehicle_type" class="form-select" required>
                            {% for code, label in vehicle_types %}
                                <option value="{{ code }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Fuel / Powertrain Type *</label>
                        <select name="fuel_type" class="form-select" required>
                            {% for code, label in fuel_types %}
                                <option value="{{ code }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Max Payload Capacity (KG) *</label>
                        <input type="number" step="0.01" name="capacity_kg" class="form-control" placeholder="e.g. 15000" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Passenger Seating Capacity (if bus)</label>
                        <input type="number" name="passenger_capacity" class="form-control" placeholder="0" value="0">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold small">Initial Location / Depot</label>
                        <input type="text" name="current_location" class="form-control" placeholder="e.g. Delhi Central Terminal Depot">
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top text-end">
                    <a href="{% url 'fleet:fleet_list' %}" class="btn btn-light me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Register Asset</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
