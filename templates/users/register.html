<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — LogiCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --brand-dark: #0b1320; --brand-red: #ea3829; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; }
        .register-card { border-radius: 18px; box-shadow: 0 20px 60px rgba(11,19,32,0.14); border: 1px solid #e2e8f0; }
        .brand-header { background: var(--brand-dark); border-radius: 18px 18px 0 0; padding: 1.5rem 2rem; }
        .btn-register { background: var(--brand-red); border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; padding: 0.7rem; }
        .btn-register:hover { background: #c92c1e; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="register-card bg-white">
                <div class="brand-header text-white d-flex align-items-center gap-3">
                    <i class="bi bi-box-seam-fill text-danger fs-2"></i>
                    <div>
                        <h4 class="mb-0 fw-bold" style="font-family: 'Oswald',sans-serif; letter-spacing:1px;">LOGICRAFT</h4>
                        <small class="opacity-75">Create your account</small>
                    </div>
                </div>
                <div class="p-4 p-md-5">
                    {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                    {% endif %}
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">First Name</label>
                                <input type="text" name="first_name" class="form-control" value="{{ form_data.first_name|default:'' }}" placeholder="John">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Last Name</label>
                                <input type="text" name="last_name" class="form-control" value="{{ form_data.last_name|default:'' }}" placeholder="Doe">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                                <input type="text" name="username" class="form-control" value="{{ form_data.username|default:'' }}" placeholder="johndoe123" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" name="email" class="form-control" value="{{ form_data.email|default:'' }}" placeholder="john@example.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" name="phone_number" class="form-control" value="{{ form_data.phone_number|default:'' }}" placeholder="+91 9876543210">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">City</label>
                                <input type="text" name="city" class="form-control" value="{{ form_data.city|default:'' }}" placeholder="Delhi">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                                <input type="password" name="password1" class="form-control" placeholder="Min. 8 characters" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" name="password2" class="form-control" placeholder="Re-enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-register btn-danger w-100 mt-4 text-white">
                            <i class="bi bi-person-check-fill me-2"></i>Create Account
                        </button>
                    </form>
                    <p class="text-center text-muted mt-3 mb-0">
                        Already have an account? <a href="{% url 'users:login' %}" class="text-danger fw-semibold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
